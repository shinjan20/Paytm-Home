<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oops! Page Not Found - Paytm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #fbfcfd;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background-color: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .hamburger-btn {
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .logo-paytm {
      font-size: 18px;
      font-weight: 800;
      color: #002970;
      letter-spacing: -0.3px;
    }
    .logo-money {
      font-size: 13px;
      font-weight: 700;
      color: #00baf2;
      letter-spacing: 0.2px;
    }
    .header-center {
      flex: 0 1 440px;
      margin: 0 24px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 14px;
      width: 100%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }
    .search-icon {
      margin-right: 10px;
      flex-shrink: 0;
    }
    .search-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 13.5px;
      color: #1e293b;
      width: 100%;
    }
    .header-right {
      display: flex;
      align-items: center;
    }
    .sign-in-btn {
      background-color: #00baf2;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 22px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-decoration: none;
    }
    .sign-in-btn:hover {
      background-color: #00a4d6;
    }
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .content-card {
      max-width: 540px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .illustration-wrapper {
      margin-bottom: 8px;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #00baf2;
      margin: 16px 0 10px 0;
      letter-spacing: -0.3px;
    }
    .description {
      font-size: 15px;
      line-height: 1.55;
      color: #334155;
      max-width: 460px;
      margin: 0 0 28px 0;
    }
    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    .home-btn {
      background-color: #00baf2;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      padding: 12px 38px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0, 186, 242, 0.28);
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-block;
    }
    .home-btn:hover {
      background-color: #00a4d6;
      transform: translateY(-1px);
    }
    .back-btn {
      background: none;
      border: none;
      color: #00baf2;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      text-decoration: none;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
    @media (max-width: 768px) {
      .header {
        padding: 0 16px;
      }
      .header-center {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button type="button" class="hamburger-btn" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="/" class="logo-link">
        <div class="logo-mark">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
            <path d="M4 16L20 4L28 12L16 28L4 16Z" fill="#002970"></path>
            <path d="M12 16L20 10L24 14L18 22L12 16Z" fill="#00baf2"></path>
            <text x="13" y="19" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui">₹</text>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-paytm">Paytm</span>
          <span class="logo-money">Money</span>
        </div>
      </a>
    </div>

    <div class="header-center">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search for Mutual Funds" class="search-input" readonly />
      </div>
    </div>

    <div class="header-right">
      <a href="/" class="sign-in-btn">Sign In</a>
    </div>
  </header>

  <main class="main-container">
    <div class="content-card">
      <div class="illustration-wrapper">
        <svg width="280" height="150" viewBox="0 0 280 150" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(68, 12)">
            <path d="M -6 16 L -13 14 M -4 8 L -11 4 M 3 4 L 1 -2" stroke="#00baf2" stroke-width="1.6" stroke-linecap="round" />
            <path d="M 12 16 C 9 8 18 1 24 5 C 28 8 26 15 20 19 C 26 19 32 23 30 29 C 28 34 20 35 14 31 C 8 37 -1 35 -3 27 C -5 21 3 15 12 16 Z" fill="#ffffff" stroke="#00baf2" stroke-width="2" stroke-linejoin="round" />
            <path d="M 6 20 C 8 14 14 12 18 14" fill="none" stroke="#00baf2" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="23" cy="22" r="1.8" fill="#002970" />
            <path d="M 27 22 L 32 24 L 26 26 Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.8" />
          </g>

          <path d="M 123 44 L 118 36 M 132 40 L 132 31 M 142 42 L 148 35 M 153 46 L 160 42" stroke="#002970" stroke-width="1.8" stroke-linecap="round" />
          <path d="M 135 27 L 135 22 M 135 19 L 135 17" stroke="#002970" stroke-width="2" stroke-linecap="round" />

          <path d="M 80 84 L 80 73 L 64 73 L 78 48 L 84 48 L 84 67 L 90 67 L 90 73 L 84 73 L 84 84 Z M 70 67 L 80 67 L 80 52 Z" fill="#002970" />

          <g transform="translate(120, 50)">
            <path d="M 2 24 C 2 9 10 1 18 1 C 26 1 34 9 34 24 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" />
            <path d="M 6 16 L 12 21 L 18 15 L 24 22 L 30 17" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </g>

          <path d="M 188 84 L 188 73 L 172 73 L 186 48 L 192 48 L 192 67 L 198 67 L 198 73 L 192 73 L 192 84 Z M 178 67 L 188 67 L 188 52 Z" fill="#002970" />

          <ellipse cx="134" cy="98" rx="66" ry="14" fill="#00baf2" stroke="#0284c7" stroke-width="2" />
          <ellipse cx="134" cy="96" rx="58" ry="10" fill="#38bdf8" />
          <path d="M 80 98 C 92 108 178 108 190 98" fill="none" stroke="#002970" stroke-width="2.6" stroke-linecap="round" />

          <path d="M 68 100 C 60 96 62 86 70 88 C 74 89 76 95 68 100 Z" fill="#22c55e" stroke="#16a34a" stroke-width="1.2" />
          <path d="M 67 98 C 71 95 73 93 75 90" fill="none" stroke="#15803d" stroke-width="1" stroke-linecap="round" />
          <path d="M 200 100 C 208 96 206 86 198 88 C 194 89 192 95 200 100 Z" fill="#22c55e" stroke="#16a34a" stroke-width="1.2" />

          <circle cx="58" cy="72" r="2.5" fill="#002970" />
          <circle cx="208" cy="75" r="2.5" fill="#002970" />
          <circle cx="218" cy="67" r="1.8" fill="#00baf2" />
          <circle cx="52" cy="80" r="1.5" fill="#00baf2" />
        </svg>
      </div>

      <h1 class="title">Oops!</h1>
      <p class="description">You've found a page that doesn't exist. You can go back or open it in our app</p>

      <div class="actions">
        <a href="/" class="home-btn">Go to Homepage</a>
        <button type="button" class="back-btn" onclick="if(window.history.length > 1){window.history.back()}else{window.location.href='/'}">Go Back</button>
      </div>
    </div>
  </main>
</body>
</html>
